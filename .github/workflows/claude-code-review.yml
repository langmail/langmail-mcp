name: Claude Code Review

# The review runs in langmail/factory's review.yml, whose sync PRs move the
# pin. What matters in this repo is in REVIEW.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    uses: langmail/factory/.github/workflows/review.yml@8a3ac1406fe1563caf44455d46049ed2befde5a7 # v0.2.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
