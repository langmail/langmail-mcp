name: Triage on Comment

# Re-triages an unassigned issue after a maintainer's comment, in
# langmail/factory's triage-on-comment.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    uses: langmail/factory/.github/workflows/triage-on-comment.yml@b244ef8cf9516b93ffc5437c25e6abb76675f0ad # v0.7.1
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
