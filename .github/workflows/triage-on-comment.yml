name: Triage on Comment

# Re-triages an unassigned issue after a maintainer's comment, in
# langmail/factory's triage-on-comment.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    uses: langmail/factory/.github/workflows/triage-on-comment.yml@e3fb051e0b87ce561a0490bf8b81465b83366b82 # v0.8.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
