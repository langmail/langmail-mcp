name: Claude Code

# Runs an @claude request from an owner, member or collaborator in
# langmail/factory's claude.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    uses: langmail/factory/.github/workflows/claude.yml@8a3ac1406fe1563caf44455d46049ed2befde5a7 # v0.2.0
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
