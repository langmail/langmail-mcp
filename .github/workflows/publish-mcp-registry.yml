name: Publish to MCP Registry
on:
  # Called by the release job of release.yml after semantic-release publishes
  # a version to npm.
  workflow_call:
    inputs:
      version:
        description: Version published to npm, without the leading v
        required: true
        type: string
  # To publish a version again by hand, e.g. after the registry was down.
  workflow_dispatch:
    inputs:
      version:
        description: Version published to npm, without the leading v (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: "1.8.9"
  # sha256 of mcp-publisher_linux_amd64.tar.gz, from that release's
  # registry_<version>_checksums.txt; update both together.
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - name: Set version in server.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          jq --arg v "$VERSION" '.packages[0].version = $v | .version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
