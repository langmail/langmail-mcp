CONSTANTS
    d1 = d1
    m1 = m1
    f1 = f1
    f2 = f2
    f3 = f3
    rSend = rSend
    rReply = rReply
    None = None
    Drafts = {d1}
    Originals = {m1}
    \* One fresh id per reply call, so staging never runs dry.
    Fresh = {f1, f2, f3}
    Requests = {rSend, rReply}
    MaxAttempts = 3
    Target <- MCTarget

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOncePerRequest
    AtMostOncePerEmail
    TruthfulResults
    NoLeakedReservation

PROPERTIES
    CallsReturn
