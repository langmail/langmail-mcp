pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    ultracite:
      run: npx ultracite fix --staged
      stage_fixed: true
    validate:
      run: npm run validate

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
