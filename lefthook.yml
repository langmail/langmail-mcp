commit-msg:
  commands:
    commitlint:
      run: bun x commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: bun x ultracite fix {staged_files}
      stage_fixed: true
    typecheck:
      run: bun run typecheck
